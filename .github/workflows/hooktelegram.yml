name: HookTelegram Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          path: control

      - uses: actions/checkout@v7
        with:
          repository: telegramdesktop/tdesktop
          ref: 157f5cfc85e2dd1fa67f129a5e31a81db5ddeb19
          submodules: recursive
          path: tdesktop

      - name: Apply HookTelegram changes
        shell: cmd
        run: git -C tdesktop apply ../control/changes.patch

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: '14.44'

      - name: Prepare libraries
        shell: cmd
        run: |
          mkdir Libraries
          mkdir ThirdParty
          call tdesktop\Telegram\build\prepare\win.bat skip-release silent qt6
          if errorlevel 1 exit /b 1

      - name: Configure and build
        shell: cmd
        working-directory: tdesktop\Telegram
        run: |
          call configure.bat -G "Ninja Multi-Config" -DTDESKTOP_API_TEST=ON -DDESKTOP_APP_DISABLE_AUTOUPDATE=ON
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Debug --target Telegram --parallel
          if errorlevel 1 exit /b 1

      - uses: actions/upload-artifact@v7
        with:
          name: HookTelegram-windows-x64-debug
          path: tdesktop/out/Debug/Telegram.exe
          if-no-files-found: error

