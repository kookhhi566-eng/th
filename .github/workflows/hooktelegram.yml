name: HookTelegram Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            artifact: debug
            prepare_flags: skip-release
            cache_key: hooktelegram-win64-libraries-v1
          - configuration: Release
            artifact: release
            prepare_flags: ''
            cache_key: hooktelegram-win64-libraries-release-v1
    steps:
      - uses: actions/checkout@v7
        with:
          path: control

      - uses: actions/checkout@v7
        with:
          repository: telegramdesktop/tdesktop
          ref: 157f5cfc85e2dd1fa67f129a5e31a81db5ddeb19
          submodules: recursive
          path: tdesktop

      - name: Apply HookTelegram changes
        shell: cmd
        run: git -C control cat-file blob HEAD:changes.patch | git -C tdesktop apply -

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: '14.44'

      - name: Restore build tools
        id: thirdparty-cache
        uses: actions/cache/restore@v6
        with:
          path: ThirdParty
          key: hooktelegram-win64-thirdparty-v1

      - name: Restore libraries
        id: libraries-cache
        uses: actions/cache/restore@v6
        with:
          path: Libraries/win64
          key: ${{ matrix.cache_key }}
          restore-keys: hooktelegram-win64-libraries-v1

      - name: Prepare libraries
        shell: cmd
        run: |
          if not exist Libraries mkdir Libraries
          if not exist ThirdParty mkdir ThirdParty
          call tdesktop\Telegram\build\prepare\win.bat ${{ matrix.prepare_flags }} silent qt6
          if errorlevel 1 exit /b 1

      - name: Save build tools
        if: steps.thirdparty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ThirdParty
          key: hooktelegram-win64-thirdparty-v1

      - name: Save libraries
        if: steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: Libraries/win64
          key: ${{ matrix.cache_key }}

      - name: Configure and build
        shell: cmd
        working-directory: tdesktop\Telegram
        run: |
          call configure.bat -G "Ninja Multi-Config" -DCMAKE_CONFIGURATION_TYPES=${{ matrix.configuration }} -DTDESKTOP_API_TEST=ON -DDESKTOP_APP_DISABLE_AUTOUPDATE=ON -DDESKTOP_APP_ENABLE_LTO=OFF
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config ${{ matrix.configuration }} --target Telegram --parallel
          if errorlevel 1 exit /b 1

      - uses: actions/upload-artifact@v7
        with:
          name: HookTelegram-windows-x64-${{ matrix.artifact }}
          path: tdesktop/out/${{ matrix.configuration }}/HookTelegram.exe
          if-no-files-found: error

